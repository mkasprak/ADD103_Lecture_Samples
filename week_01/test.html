<!doctype html>
<!-- Declares this is an HTML5 document — always the first line -->
<html lang="en">
<!-- lang="en" tells browsers and screen readers the page language -->

<head>
  <!-- <head> holds metadata — nothing here is visible on the page -->
  <meta charset="UTF-8" />
  <!-- UTF-8 supports all characters and emoji -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Makes the page scale correctly on mobile devices -->
  <title>Document</title>
  <!-- Text shown in the browser tab -->
</head>

<body>
  <!-- All visible content lives inside <body> -->
  <h1>Test number 2</h1>
  <!-- h1 = the page's main heading; use only one per page -->
  <p><a href="../index.html">Home</a></p>
  <!-- <a> creates a hyperlink; ../ goes up one folder level -->
</body>

</html>
